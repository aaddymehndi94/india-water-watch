name: Publish reviewed progress site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.6.0
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Check and test
        run: |
          python tools/validate_starter.py
          python -m unittest discover -s tests -v
          pnpm check
      - name: Build repository-path site
        env:
          PUBLIC_SITE_URL: https://aaddymehndi94.github.io
          PUBLIC_BASE_PATH: /india-water-watch/
        run: pnpm build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
